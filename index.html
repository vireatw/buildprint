<style>
:root{
  /* Layout: a phone-first daily site report. Summary first (headline, tiles, stage track), then tasks, plan, crew, photos. Two columns on desktop. */
  --paper:#ECEFF1; --panel:#FFFFFF; --ink:#16222C; --muted:#5C6974; --line:#D3DADF;
  --accent:#F5B700; --accent-ink:#1E1700;
  --done:#2F8A57; --doing:#E07800; --next:#7D8A95;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(22,34,44,.06),0 6px 18px rgba(22,34,44,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1824; --panel:#132434; --ink:#E4ECF2; --muted:#94A4B1; --line:#26394B;
    --done:#4CB97C; --doing:#F29A33; --next:#8697A5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1824; --panel:#132434; --ink:#E4ECF2; --muted:#94A4B1; --line:#26394B;
  --done:#4CB97C; --doing:#F29A33; --next:#8697A5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.k{font:500 11px/1.3 var(--mono);letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}

/* header */
.top{color:#16222C;padding-top:env(safe-area-inset-top);background-color:#A6A7A4;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.08)),url(concrete.jpg);background-size:100% 100%,320px 320px;border-bottom:1px solid #85888B;box-shadow:inset 0 -2px 3px rgba(0,0,0,.12)}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#16222C 12px 24px)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px}
.site{flex:1;min-width:0;padding-bottom:12px}
.site .k{color:#1E2A34;font-weight:600;letter-spacing:.08em}
.site h1{font-size:22px;line-height:1.3;margin-top:2px}
.site .addr{font-size:13px;color:#24303A}
.tabs{display:flex;gap:4px}
.tabs button{padding:10px 14px 12px;color:#2E3A44;font-weight:500;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:#0E1820;font-weight:700;border-color:#16222C}
.btabs{display:none}
.sitebtn{display:inline-flex;align-items:center;gap:6px;text-align:left;font:inherit;color:inherit;max-width:100%;border-radius:8px}
.sitebtn span{min-width:0}
.sitebtn .chev{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;background:rgba(255,255,255,.45);border-radius:999px;padding:2px}
.sheet{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,20,.5)}
.sheet-in{position:relative;width:100%;max-width:520px;max-height:82vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:720px){ .sheet{align-items:flex-start;padding-top:10vh} .sheet-in{border-radius:16px;padding-bottom:18px} }
.sheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-hd h2{font-size:18px}
button.tz{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;min-width:0;text-align:left;display:flex;align-items:center;gap:6px;cursor:pointer}
button.tz span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.tz.none span{color:var(--muted)}
button.tz::after{content:'';flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.6;margin-right:2px}
.zopts{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.zopt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;font-size:17px;text-align:left;background:none;border:0;color:var(--ink)}
.zopt .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.zopt.radio .ck{border-radius:50%}
.zopt[aria-checked=true] .ck{background:var(--accent);border-color:var(--accent)}
.zopt[aria-checked=true] .ck::after{content:'';width:6px;height:11px;border-right:2.6px solid #111;border-bottom:2.6px solid #111;transform:translateY(-1px) rotate(45deg)}
.zopt small{color:var(--muted);font-size:13px;margin-left:auto}
.zsep{height:1px;background:var(--line);margin:6px 4px}
#crewSheet .field,#islCrewSheet .field{margin-bottom:10px}
#islCrewSheet .nckind{display:flex;margin-bottom:12px}
#islCrewSheet .nckind button{flex:1;padding:8px 0;font-size:15px;font-weight:600}
#islCrewSheet .nckind button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#1E1700}
#islCrewSheet input{font-size:16px}
#islCrewSheet .note:empty{display:none}
#islCrewSheet .actions{margin-top:12px}
.icsplit .sp1 .sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;padding:0 4px}
.icsplit .sp1 .sg input{grid-column:1 / -1;grid-row:1;width:100%;padding:4px 0;font-size:18px;text-align:center}
.icsplit .sp1 .sg button{width:100%;height:32px;font-size:18px;grid-row:2;border-radius:8px;background:var(--paper)}
#crewSheet .nckind{display:flex;margin-bottom:12px}
#crewSheet .nckind button{flex:1;padding:8px 0;font-size:15px;font-weight:600}
#crewSheet .nckind button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#1E1700}
#crewSheet .note:empty{display:none}
#crewSheet .actions{margin-top:14px}
#crewSheet input{font-size:16px}
.sitelist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.sitelist>li>button{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.sitelist>li>button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.sitelist .nm{font-weight:700;font-size:16px;line-height:1.35}
.sitelist .ad{font-size:13px;color:var(--muted)}
.sitelist .sl{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sitelist .sl b{font-weight:700}
.sitelist .ck{margin-left:auto;flex:none;color:var(--done);font-weight:700}
.sitelist .trash{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.trashrow{display:flex;align-items:center;gap:8px;padding:8px 0}
.trashrow .btn{padding:7px 12px;flex:none}
.trashrow .purge{color:#C0392B;border-color:color-mix(in srgb,#C0392B 50%,var(--line))}
.trashrow .purge.armed{background:#C0392B;color:#fff}
.vlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.vlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.vlist li:first-child{border-top:0}
.vlist .vn{min-width:0}
.vlist .vt{text-align:right;flex:none}
.vlist .me{margin-left:6px;font-size:12px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.newsite{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.dangerzone .btn{border-color:#C0392B;color:#C0392B}
.dangerzone .btn.armed{background:#C0392B;color:#fff}
.pe{position:fixed;inset:0;z-index:60;background:#0E1A24;color:#fff;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pe-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.pe-top b{font-size:16px}
.pe-act{display:flex;gap:6px}
.pe-top button{color:#fff;padding:8px 12px;border:1px solid rgba(255,255,255,.3);border-radius:10px;font-size:14px;white-space:nowrap}
.pe-top button.warn{background:#C0392B;border-color:#C0392B}
.pe-top .pri,.pe-hint .pri{background:var(--accent)!important;color:#1E1700!important;border-color:var(--accent)!important;font-weight:700}
.pe-stage{position:relative;flex:1;overflow:hidden;background:#1B2833;touch-action:none;cursor:crosshair}
.pe-stage.panning{cursor:grab}
.pe-world{position:absolute;left:0;top:0;transform-origin:0 0}
.pe-world img{position:absolute;left:0;top:0;background:#fff;pointer-events:none;max-width:none}
.pe-world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.pe-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.pe-mode{position:absolute;left:10px;top:10px;display:flex;padding:3px;gap:2px;border-radius:12px;background:rgba(14,26,36,.85);border:1px solid rgba(255,255,255,.2);z-index:2}
.pe-mode button{display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:9px;color:#fff;font-size:14px;font-weight:700}
.pe-mode button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pe-mode button[aria-pressed="true"]{background:var(--accent);color:#1E1700}
.pe-mode button:disabled{opacity:.35}
.pe-zoom button{width:42px;height:42px;border-radius:10px;background:rgba(14,26,36,.82);color:#fff;font-size:20px;border:1px solid rgba(255,255,255,.25)}
.pe-load{position:absolute;inset:0;display:grid;place-items:center;color:#B8C6D1}
.pe-hint{padding:10px 14px;font-size:14px;line-height:1.5;background:#132434;border-top:1px solid #26394B;min-height:58px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.pe-hint .grow{flex:1;min-width:180px;color:#DCE6EE}
.pe-hint button{padding:7px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px}
.pe-hint button:disabled{opacity:.4}
#peHint input{background:#0C1824!important;color:#fff!important;border:1px solid #2E4458!important}
.pe-hint .pe-zhelp{flex:1 1 100%;font-size:13px;color:#A9BAC8;min-width:0;order:9}
.pe-hint input{flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid #2E4458;background:#0C1824;color:#fff;font-size:16px}
.pe-tools{display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#0E1A24;scrollbar-width:none}
.pe-tools::-webkit-scrollbar{display:none}
.pe-tools button{position:relative;flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 1px;border-radius:12px;color:#B8C6D1;font-size:11.5px;line-height:1.2;white-space:nowrap}
.pe-tools button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pe-tools button[aria-pressed="true"]{background:var(--accent);color:#1E1700;font-weight:700}
.pe-tools button.done::after{content:'';position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:#4CB97C;box-shadow:0 0 0 2px #0E1A24}
body.pe-open{overflow:hidden}
.geo{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.geo span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.geo span.ok{border-color:color-mix(in srgb,var(--done) 55%,transparent);color:var(--done);font-weight:500}
.offbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.offbar .tx{flex:1;min-width:0;line-height:1.45}
.offbar .tx small{color:var(--muted);font-size:13px}
.offbar .btn{flex:none}
.offbar.off{background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
.offbar .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--panel);flex:none}
.offbar .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.offbar.punch{align-items:flex-start;flex-wrap:wrap}
.offbar.punch .tx{flex:1 1 200px}
.offbar.punch>.btn{flex:1 1 100%;padding:12px}
.offbar.punch>.pbtns{flex:1 1 100%;display:flex;gap:10px}
.offbar.punch>.pbtns .btn{flex:1 1 0;padding:12px}
.plist{list-style:none;margin:8px 0 4px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.plist li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plist .pt{color:var(--muted);font-size:13px}
.plist em{font-style:normal;color:var(--done);font-weight:600}
.plist .me{font-size:12px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.pdot.in{background:var(--done)} .pdot.out{background:var(--muted)}
.offbar .pnote{display:block;margin-top:4px}
.tradelist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.tradelist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.tradelist li:first-child{border-top:0}
.tradelist .tn{font-weight:600;flex:1;min-width:0}
.tradelist .tcn{font-size:13px}
.tradelist .mini.armed{background:#C0392B;color:#fff;border-color:#C0392B}
.hatbtn{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
.hatbtn .lh,.hatpal .lh{width:24px;height:17px}
.hatbtn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hatpal{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.hatpal button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
.hatpal button[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hatpal button:disabled{opacity:.25;cursor:not-allowed}
.tradeadd{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.isl-half{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.isl-date{font-size:13px;font-weight:700;color:#fff;background:rgba(22,34,44,.62);padding:3px 10px;border-radius:999px}
.seg2{display:flex;background:rgba(22,34,44,.62);border-radius:999px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg2 button{color:#fff;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;white-space:nowrap}
.seg2 button[aria-checked="true"]{background:var(--accent);color:#1E1700}
.seg2 button{position:relative}
.seg2 .nowdot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:#E8553D}
.isl-full.nonight{background:#16213A}
.isl-full.nonight canvas,.isl-full.nonight .isl-legend,.isl-full.nonight #simRot,.isl-full.nonight #simPause,.isl-full.nonight #simFs,.isl-full.nonight #simFsRot{visibility:hidden}
.isl-nonight{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;color:#E4ECF2;text-align:center;pointer-events:none}
.isl-nonight b{font-size:15px;font-weight:600;opacity:.75}
.isl-nonight span{font-size:20px;font-weight:700}
@media (max-width:520px){ .isl-half .seg2 button{padding:7px 11px;font-size:13.5px} }

.isl-day{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:0;background:rgba(16,26,36,.62);color:#fff;border-radius:999px;padding:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (max-width:760px){ .isl-day{bottom:12px} }
.isl-day .dstep{width:22px;height:24px;border-radius:50%;color:#fff;font-size:15px;line-height:1;padding:0}
.isl-day .dstep:disabled{opacity:.3}
.isl-day .dpick{position:relative;display:block;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer}
.isl-day .dtx{font-size:12px;font-weight:600;white-space:nowrap;line-height:1.3}
.isl-day .dtx.nor{opacity:.75;font-weight:500}
.isl-day input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;border:0;padding:0;min-width:0}
.isl-legend{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(16,26,36,.62);color:#fff;border-radius:12px;padding:6px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100% - 198px);pointer-events:none}
@media (max-width:760px){ .isl-legend{bottom:12px} }
.isl-legend ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.isl-legend li{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.25;min-width:0}
.isl-legend .lt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl-legend .lh{width:20px;height:14px;flex:none}
.isl-legend .lm{height:18px;fill:none;stroke:#F0B429;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.isl-legend .lt small{margin-left:5px;opacity:.7;font-size:12px}
.isl-legend b{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums;flex:none}
.isl-off{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:44px;padding:0 18px;border-radius:999px;background:rgba(22,34,44,.62);color:#fff;font-weight:700;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.isl-off.on{background:rgba(245,183,0,.92);color:#1E1700}
.fold-all{display:flex;justify-content:flex-end;gap:8px}
.card.fold{padding:0;gap:0}
.fold-h{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left;border-radius:14px}
.fold-h .ft{font-weight:700;font-size:16px;flex:1 0 auto;white-space:nowrap}
.fold-h .fchip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-h .fchev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.fold.open .fold-h .fchev{transform:rotate(180deg)}
.fold-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.fchip{font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis}
.fchip.ok{color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent);font-weight:500}
.fchip.no{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.banner{max-width:1120px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);font-size:13.5px;margin-inline:16px}
@media (min-width:1152px){.banner{margin-inline:auto}}

main{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
.page{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card > h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card > h2 .k{margin-left:auto;font-weight:500}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{color:#C0392B;border-color:color-mix(in srgb,#C0392B 40%,var(--line))}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .dsel{flex:1;text-align:center;min-width:0}
.datebar .dsel b{display:block;font-size:20px;line-height:1.2}
.datebar .dsel small{color:var(--muted);font-size:13px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px;flex:none}
.round:disabled{opacity:.35}

.legal{margin:22px 4px 8px;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
/* headline */
.headline{border-left:6px solid var(--accent)}
.hl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 2px}
.hl-edit svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.headline p{margin:4px 0 0;font-size:18px;line-height:1.6}
.headline mark{background:none;color:inherit;font-weight:700;box-shadow:inset 0 -.45em 0 color-mix(in srgb,var(--doing) 28%,transparent)}
.headline mark.d{box-shadow:inset 0 -.45em 0 color-mix(in srgb,var(--done) 25%,transparent)}
.headline .hl{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.headline .hl-top .k{font:800 22px/1.3 var(--body,inherit);letter-spacing:0;color:var(--ink)}
.hl-t{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.hl-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hl-l li{position:relative;padding-left:18px;font-size:16px;font-weight:500;line-height:1.55}
.hl-l li b{font-weight:800}
.hl-l li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--done)}
.hl-l li.doing::before{background:var(--doing)}
.hl-l.info li::before{background:var(--muted)}
.hl-l.next li{color:var(--muted)}
.hl-l.next li::before{background:var(--next)}
.hl-st{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;font-size:12px;font-weight:700;vertical-align:1px;background:color-mix(in srgb,var(--doing) 18%,transparent);color:var(--doing)}
.headline .by{margin-top:8px;font-size:12.5px;color:var(--muted)}
.headline .byb{display:inline-flex;align-items:center;gap:4px;text-align:left;border-radius:6px;padding:2px 0}
.headline .byb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex:none}
.headline .byb[aria-expanded="true"] svg{transform:rotate(180deg)}
.hist-l{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line);font-size:13px}
.hist-l li{padding:8px 0;border-bottom:1px solid var(--line)}
.hist-l li:last-child{border-bottom:0}
.hist-l .ch{margin-top:2px;line-height:1.55}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-size:34px;line-height:1.05}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile .stage-name{font-size:19px;font-weight:700;line-height:1.3}
.delta.up{color:var(--done)} .delta.down{color:#C0392B}
.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border:0}
.tasks li.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);margin:0 -16px;padding-inline:16px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.done{color:var(--done);background:color-mix(in srgb,var(--done) 13%,transparent)}
.st.doing{color:var(--doing);background:color-mix(in srgb,var(--doing) 15%,transparent)}
.st.next{color:var(--next);border:1px solid var(--line)}
.tasks .tx{flex:1;min-width:0;font-weight:500}
.zchip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* plan */
.plan{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;touch-action:manipulation}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.plan svg.zl{position:absolute;inset:0;width:100%;height:100%}
.zp{fill:transparent;stroke:rgba(22,34,44,.3);stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer;stroke-linejoin:round}
.zp.st-done{fill:color-mix(in srgb,var(--done) 18%,transparent);stroke:var(--done)}
.zp.st-doing{fill:color-mix(in srgb,var(--doing) 24%,transparent);stroke:var(--doing);animation:pulsef 2.4s ease-in-out infinite}
.zp.st-next{stroke:var(--next);stroke-dasharray:6 4}
.zp.sel{stroke:var(--ink);stroke-width:3.5}
@keyframes pulsef{50%{fill-opacity:.35}}
.plan .zlab{position:absolute;background:rgba(255,255,255,.94);color:#16222C;font-size:12px;line-height:1.3;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.plan .zlab.c{transform:translate(-50%,-50%);font-size:14px;padding:2px 9px}
.plan .zone{position:absolute;border:2px solid var(--next);background:color-mix(in srgb,var(--next) 10%,transparent);border-radius:6px;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px;color:#16222C}
.plan .zone span{background:rgba(255,255,255,.92);font-size:12px;line-height:1.25;font-weight:700;padding:1px 5px;border-radius:5px;max-width:100%;word-break:break-all}
.plan .zone.st-done{border-color:var(--done);background:color-mix(in srgb,var(--done) 18%,transparent)}
.plan .zone.st-doing{border-color:var(--doing);background:color-mix(in srgb,var(--doing) 22%,transparent);animation:pulse 2.4s ease-in-out infinite}
.plan .zone.st-next{border-style:dashed}
.plan .zone.st-none{border-color:rgba(22,34,44,.25);background:transparent}
.plan .zone.sel{outline:3px solid var(--ink);outline-offset:1px}
@keyframes pulse{50%{background:color-mix(in srgb,var(--doing) 8%,transparent)}}
.plan.editing{cursor:crosshair}
.plan .draft{position:absolute;border:2px dashed var(--ink);background:rgba(245,183,0,.2);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:2px solid}
.zcap{margin-top:8px;font-size:14px}
.plan-empty{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}

/* crew */
.crew{display:flex;flex-direction:column;gap:7px}
.crow{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.crow .bar{height:12px;border-radius:6px;background:var(--paper);overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.crow b{text-align:right;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.crew-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}

/* 7 day chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:18px;border-bottom:1px solid var(--line)}
.chart button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.chart .b{width:100%;max-width:34px;background:color-mix(in srgb,var(--ink) 22%,transparent);border-radius:5px 5px 0 0;position:relative}
.chart .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 13px var(--display);color:var(--muted)}
.chart button.on .b{background:var(--ink)}
.chart button.on .b span{color:var(--ink)}
.chart-x{display:flex;gap:6px;margin-top:4px}
.chart-x span{flex:1;text-align:center;font:500 10.5px var(--mono);color:var(--muted)}

/* stage track */
.stages{display:flex;overflow-x:auto;scrollbar-width:thin;padding:14px 2px 8px;gap:0}
.stg{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;min-width:96px}
.stg::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.stg:first-child::before{display:none}
.stg.done::before,.stg.doing::before{background:var(--done)}
.stg .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--panel);z-index:1;display:grid;place-items:center}
.stg.done .dot{background:var(--done);border-color:var(--done)}
.stg.done .dot::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.stg.doing .dot{border-color:var(--doing);background:var(--doing);animation:stgPulse 1.6s ease-in-out infinite}
@keyframes stgPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--doing) 55%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--doing) 0%,transparent);transform:scale(1.12)}}
.stg .nm{font-size:13px;line-height:1.35;padding:0 4px}
.stg.doing .nm{font-weight:700}
.stg.upcoming .nm{color:var(--muted)}
.stg .now{font:500 10.5px var(--mono);color:var(--doing)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos button{aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--paper);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;display:grid;place-items:center}
.issues{white-space:pre-wrap;margin:0}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-weight:700;font-size:14px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;min-width:0}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.wxsplit{display:inline-flex;flex-wrap:wrap;gap:4px 16px}
.wxrow{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.wxrow .wxh{flex:none;width:2.6em;padding-top:8px;font-size:14px;color:var(--muted);font-weight:700}
.wxrow .seg{flex:1;min-width:0}
.seg button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.steppers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stepper{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px}
.stepper .nm{flex:1;font-size:14px;min-width:0}
.stepper button{width:36px;height:36px;border-radius:8px;background:var(--paper);font-size:20px;line-height:1}
.stepper input{width:52px;text-align:center;padding:6px 2px;font-family:var(--display);font-size:20px;font-weight:700;border-radius:8px}
.form-total{display:flex;align-items:baseline;gap:8px;justify-content:flex-end}
.form-total .num{font-size:30px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 130px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow .seg button{padding:5px 10px;font-size:13px}
.trow .seg button[aria-pressed="true"].s-done{background:var(--done);border-color:var(--done);color:#fff}
.trow .seg button[aria-pressed="true"].s-doing{background:var(--doing);border-color:var(--doing);color:#fff}
.trow .seg button[aria-pressed="true"].s-next{background:var(--next);border-color:var(--next);color:#fff}
.trow .x{width:36px;height:36px;border-radius:8px;color:var(--muted);font-size:18px}
.btn.carry{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;padding:12px}
.note.autofill{color:var(--ink);background:rgba(242,169,0,.12);border:1px solid rgba(242,169,0,.35);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.btn.carry svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crewq{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:0 10px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.crewq svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.crewq input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:44px;padding:0;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.crewq input::-webkit-search-cancel-button{display:none}
.crewq-x{width:32px;height:32px;border-radius:50%;color:var(--muted);flex:none}
.crewq-add{margin:-2px 0 8px}
.crewq-none{margin:4px 0 8px}
.ctasks{margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.ctasks button,.ctasks input,.ctasks select{width:auto;height:auto;font-family:inherit;font-size:15px;font-weight:400;text-align:left;line-height:1.3}
.ctasks .trow .seg button{width:auto;height:auto;padding:5px 12px;font-size:13px;white-space:nowrap;background:var(--panel);border-radius:999px}
.ctasks .trow .ti,.ctasks .trow .tz,.ctasks .ctadd input{width:100%;padding:8px 10px;border-radius:10px;font-size:16px}
.ctasks .trow .x{width:36px;height:36px;font-size:18px;text-align:center;background:none}
.ctasks .ctadd .btn{flex:none;padding:8px 14px;font-weight:600;text-align:center}
.ctasks .trow.tin{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;grid-template-areas:"s s x" "t t t" "z z z";padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.ctasks .trow.tin .seg{grid-area:s}.ctasks .trow.tin .ti{grid-area:t}.ctasks .trow.tin .tz{grid-area:z}.ctasks .trow.tin .x{grid-area:x}
@media (min-width:761px){ .ctasks .trow.tin{grid-template-columns:auto minmax(0,1fr) 130px 36px;grid-template-areas:"s t z x"} }
.ctadd{display:flex;gap:6px;margin-top:6px}
.ctadd input{flex:1;min-width:0}
.othertasks{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.othertasks h3{margin:0 0 6px;font-size:15px}
.othertasks h3 .muted{font-weight:400;font-size:13px;margin-left:4px}
.stepper.cs[hidden]{display:none!important}
.trow.nrow{grid-template-columns:minmax(0,1fr) 110px 130px 36px}
@media (max-width:760px){ .trow.nrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;grid-template-areas:"t t x" "z w w"} .trow.nrow .ti{grid-area:t} .trow.nrow .tz{grid-area:z} .trow.nrow .tw{grid-area:w} .trow.nrow .x{grid-area:x} }
.nadd{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:6px;margin-top:8px}
@media (max-width:760px){ .nadd{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"i i" "w b"} .nadd #fNextIn{grid-area:i} .nadd #fNextTw{grid-area:w} .nadd .btn{grid-area:b} }
.nadd input{font-size:16px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px dashed var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.sticky-save{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}

/* history */
.hist{list-style:none;margin:0;padding:0}
.hist li button{display:grid;grid-template-columns:92px minmax(0,1fr) 64px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.hist .d b{display:block;font-size:15px}
.hist .d small{color:var(--muted);font-size:12px}
.hist .sum{font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hist .w{text-align:right}
.hist .w .num{font-size:24px}
.hist .w small{display:block;font-size:11.5px;color:var(--muted)}

/* settings */
.srow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 36px;gap:6px;align-items:center}
.flist li.fh{font-size:12px;color:var(--muted);font-weight:700}
.flist li.fh span:not(:first-child){text-align:center}
.flist input{min-width:0;width:100%}
.flist input[type=number]{text-align:center;padding-left:4px;padding-right:4px}
.sdates{display:flex;flex-wrap:wrap;gap:6px 12px;flex-basis:100%;font-size:13px;color:var(--muted);align-items:center}
.sdates label{display:flex;align-items:center;gap:6px}
.slist .sdates input{flex:0 0 auto;width:auto;padding:4px 8px;font-size:13px;min-height:32px}
.dlist{list-style:none;margin:0 0 4px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.dlist li{position:relative}
.dthumb{display:flex;flex-direction:column;gap:4px;width:100%;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;font:inherit;font-size:13px;line-height:1.3;cursor:zoom-in;color:inherit}
.dthumb img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:6px}
.dthumb span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.dlist .mini{position:absolute;top:2px;right:2px}
#docSheet .seg{margin-bottom:12px}

.crow{grid-template-columns:110px 1fr 44px}
.stepper.cs{flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 8px 12px}

.csrow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sg{display:inline-flex;align-items:center;gap:6px}

.stepper.cs .nmv{flex:1;min-width:0}
.stepper.cs .nm{white-space:nowrap}
.half{display:flex;flex-wrap:wrap;gap:6px 12px}
.half[hidden]{display:none}
.half .sg button{width:30px;height:30px}
.half .sg input{width:42px;font-size:17px}
.stepper .shseg{display:flex;gap:6px}
.stepper .shseg button{width:auto;height:auto;padding:5px 14px;font-size:13.5px;line-height:1.3;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.stepper .shseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* alignment fixes for narrow phones (iOS date input, stepper rows) */
main{overflow-x:clip}
.card{max-width:100%}
.field,.srow>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#fCrew,#fMach{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.stepper{min-width:0;max-width:100%}
.stepper.cs .csrow{min-width:0}
.stepper.cs .sg{flex:none}
.stepper.cs .nmv{flex:1 1 auto}
.stepper.cs .vd{max-width:100%}
@media (max-width:420px){
  .stepper.cs .sg button{width:34px;height:34px}
  .stepper.cs .sg input{width:46px}
  .stepper.cs{padding:8px 8px 10px 10px}
}
.stepper .names{display:flex;flex-direction:column;gap:6px}
.stepper .cstot{flex:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.stepper .cstot small{font-size:11.5px;font-weight:500;color:var(--muted,#8a97a6)}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.split3.s4{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.split3.s4 .sp1:last-child .sl{color:#6C7BD9}

.sp1 .sl{font-size:12.5px;color:var(--muted)}
.stepper.cs .sp1 .sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;padding:0 4px}
.stepper.cs .sp1 .sg input{grid-column:1 / -1;grid-row:1;width:100%;padding:4px 0;font-size:18px;text-align:center}
.stepper.cs .sp1 .sg button{width:100%;height:32px;font-size:18px;grid-row:2}
.stepper .names .nmi{max-width:100%;width:100%}
.tasks .tby{display:block;font-size:12px;color:var(--muted);font-weight:500}
/* lightbox & toast */
.lightbox{position:fixed;inset:0;background:rgba(5,10,16,.88);z-index:60;display:flex;flex-direction:column}
.lightbox .bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
.lightbox .bar button{color:#fff;font-size:15px;padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px}
.lightbox .body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.lightbox.zoomed .body{display:block}
.lightbox.zoomed img{max-width:none;max-height:none;width:220%}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width: 760px){
  body{font-size:15px}
  .top-in{padding:12px 16px 12px}
  .site{padding-bottom:0}
  .tabs{display:none}
  .btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .btabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;color:var(--muted);font-weight:500}
  .btabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btabs button[aria-selected="true"]{color:var(--ink)}
  .btabs button[aria-selected="true"] svg{stroke:var(--ink)}
  .btabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:40px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
  .btabs button{position:relative}
  main{padding:12px 12px 32px}
  .tiles{grid-template-columns:1fr 1fr}
  .tile .v{font-size:30px}
  .cols{grid-template-columns:1fr}
  .headline p{font-size:17px}
  .trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;grid-template-areas:"s s x" "t t t" "z w w"}
  .trow select.tw{grid-area:w}
  .trow .seg{grid-area:s}
  .trow .x{grid-area:x}
  .trow .ti{grid-area:t}
  .trow .tz{grid-area:z}
  .srow{grid-template-columns:1fr}
  .slist li{flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .slist input{flex:1 1 100%}
  .slist .seg{flex:1;min-width:0}
  .slist .seg button{padding:6px 8px;font-size:13px;flex:1}
  .slist .mini{width:34px;min-width:34px;padding:0}
  .hist li button{grid-template-columns:78px minmax(0,1fr) 54px}
}
@media (min-width: 761px){ body{padding-bottom:0} .sticky-save{bottom:12px} .toast{bottom:28px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="hazard"></div>
  <div class="top-in">
    <div class="site">
      <div class="k" id="siteCo">築跡 · 工地日報</div>
      <h1><button type="button" class="sitebtn" id="sitePickBtn" aria-haspopup="dialog" aria-label="切換工地"><span id="siteName">載入中…</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h1>

    </div>
    <nav class="tabs" role="tablist" aria-label="頁面">

      <button role="tab" data-p="report" aria-selected="false">填寫日報</button>
      <button role="tab" data-p="history" aria-selected="false">歷史紀錄</button>
      <button role="tab" data-p="settings" aria-selected="false">工地設定</button>
    </nav>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <section class="page" id="p-today"><div class="card"><span class="spin"></span> 正在讀取工地資料…</div></section>
  <section class="page" id="p-island" hidden><div class="isl-empty"><span class="spin"></span> 正在讀取工地…</div></section>
  <section class="page" id="p-report" hidden></section>
  <section class="page" id="p-history" hidden></section>
  <section class="page" id="p-settings" hidden></section>
</main>
<nav class="btabs" role="tablist" aria-label="頁面">
  <button role="tab" data-p="island" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 7.5v5L12 17l8-4.5v-5"/><path d="M3 16.5l9 4.5 9-4.5"/></svg>工地</button>
  <button role="tab" data-p="today" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
  <button role="tab" data-p="report" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6M12 9v6"/></svg>填日報</button>
  <button role="tab" data-p="history" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>紀錄</button>

</div>

    <div class="actions"><button type="button" class="btn primary grow" id="ncOk">新增</button><button type="button" class="btn" data-ncclose>取消</button></div>
  </div>
</div>
<div class="sheet" id="zoneSheet" hidden role="dialog" aria-modal="true" aria-labelledby="zsTitle">

  </div>
</div>
<div class="sheet" id="siteSheet" hidden role="dialog" aria-modal="true" aria-labelledby="ssTitle">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-in">
    <div class="sheet-hd"><h2 id="ssTitle">我的工地</h2><button type="button" class="mini" data-close aria-label="關閉">✕</button></div>
    <ul class="sitelist" id="ssList"></ul>
    <div id="ssNew"></div>
  </div>
</div>

async function doPunch(kind){

  let name=cur.name||NAMES[id]||''; if(!name&&USER&&ME){ try{ const ps=await USER.profiles([ME]); name=(ps&&ps[ME]&&ps[ME].name)||''; }catch(e){} }
  cur.id=id; cur.name=name||(MODE==='local'?'你':'未具名'); cur.sites=cur.sites||{};
  const S=cur.sites[CUR]=cur.sites[CUR]||{}, now=new Date().toISOString(), d=S[TODAY]=S[TODAY]||{};
  if(kind==='in'){ if(!d.in||d.noin){ d.in=now; delete d.noin; } d.out=null; } else { if(!d.in){ d.in=now; d.noin=1; } d.out=now; }   // 下班 without a morning punch is still recorded

  PUNCH[id]=cur;
  if(kind==='in'&&draft&&draft.date===TODAY){ if(!draftDirty) draft=null; else { const f=engFill(draft); if(f!==draft){ const et=engTradeName(); draft.workers=f.workers; draft.split=f.split; draft.vendors=f.vendors; } } }

}

    let un=null, done=false; const fin=v=>{ if(done) return; done=true; if(un) try{ un(); }catch(e){} res(v); };

function blankReport(date,auto){
  const prev=prevReport(date), a0=wxAuto(date), r={date,weather:a0?wxText(a0):'晴',wx:a0?{am:a0.am,pm:a0.pm}:{am:'晴',pm:'晴'},workers:{},tasks:[],issues:'',photos:[]};   // weather starts from the automatic record / forecast when the site has a location
  // 明天自動填寫: the previous report's 明日工作事項 become today's work, and their crews/machines come along with
  // yesterday's counts and vendors (all of yesterday's crews when 「延續今日工作」 was used)
  const nx=auto&&prev?(prev.tasks||[]).filter(t=>t.status==='next'&&String(t.text||'').trim()):[];
  if(nx.length){
    r.tasks=nx.map(t=>({id:uid(),text:t.text,zone:t.zone||'',status:'doing',trade:t.trade||''}));
    r.split={}; r.vendors={}; r.machines={};
    const want=new Set(nx.map(t=>t.trade).filter(Boolean));
    if(prev.carry) Object.keys(prev.workers||{}).concat(Object.keys(prev.machines||{})).forEach(k=>want.add(k));
    let nc=0;
    want.forEach(k=>{ const isM=(prev.machines&&k in prev.machines)||isMachTrade(k), x=splitOf(prev,k,isM); if(!headsOf(x)) return;
      r.split[k]={f:x.f,am:x.am,pm:x.pm,ng:x.ng||0}; if(isM) r.machines[k]=headsOf(x); else r.workers[k]=workOf(x);
      if(prev.vendors&&prev.vendors[k]) r.vendors[k]=prev.vendors[k]; nc++; });
    r.auto={from:prev.date,nt:nx.length,nc};
  }
  return engFill(r);
}

async function shrink(file,maxEdge,q){
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,maxEdge/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q));
}
function assetErr(e){
  const c=e&&e.code;
  if(c==='too_large') return '檔案太大（上限 20 MB）';
  if(c==='unsupported_type') return '不支援這種檔案格式';
  if(c==='quota_or_state') return '圖片儲存空間已滿';
  if(c==='rate_limited') return '上傳太頻繁，請稍等再試';
  return '上傳失敗，請再試一次';
}

function wireZoneDraw(pe){
  pe.querySelectorAll('[data-z]').forEach(z=>{ z.style.pointerEvents=zoneDrawMode?'none':'auto'; z.onclick=()=>{ const i=$(`[data-zn="${z.dataset.z}"]`); if(i){ i.focus(); i.select(); } }; });
  if(!zoneDrawMode) return;
  let st=null, dr=null;
  const pt=e=>{ const r=pe.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; };
  pe.style.touchAction='none';
  pe.onpointerdown=e=>{ e.preventDefault(); pe.setPointerCapture(e.pointerId); st=pt(e); dr=document.createElement('div'); dr.className='draft'; pe.appendChild(dr); upd(st); };
  const upd=p=>{ const x=Math.min(st[0],p[0]),y=Math.min(st[1],p[1]),w=Math.abs(p[0]-st[0]),h=Math.abs(p[1]-st[1]); Object.assign(dr.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'}); return [x,y,w,h]; };
  pe.onpointermove=e=>{ if(st) upd(pt(e)); };
  pe.onpointerup=e=>{ if(!st) return; let [x,y,w,h]=upd(pt(e)); dr.remove();
    if(w<0.03||h<0.03){ w=0.16; h=0.16; x=Math.max(0,Math.min(1-w,st[0]-w/2)); y=Math.max(0,Math.min(1-h,st[1]-h/2)); }
    st=null;
    const n=SITE.zones.length; const name=String.fromCharCode(65+(n%26))+'區';
    const z={id:'z'+uid(),name,x:+x.toFixed(4),y:+y.toFixed(4),w:+w.toFixed(4),h:+h.toFixed(4)};
    SITE.zones.push(z); saveSite(); renderSettings(); const i=$(`[data-zn="${z.id}"]`); if(i){ i.focus(); i.select(); }
    toast('已新增「'+name+'」，可以在下方改名');
  };
}

async function uploadDrawings(files){
  const say=t=>{ const m=$('#dMsg'); if(m) m.innerHTML=t; };
  files.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant',{numeric:true}));
  const set=DSET; let ok=0;
  for(let i=0;i<files.length;i++){ const file=files[i];
    say(`<span class="spin"></span> 上傳中 ${i+1}／${files.length}…`);
    try{
      let img=file, pdfId=null; const name=file.name.replace(/\.[^.]+$/,'').replace(/^\d+[-_．.\s]+/,'').trim()||file.name;
      if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){ img=await pdfToImage(file); if(MODE!=='local'){ try{ pdfId=(await ASSETS.upload(file,{type:'application/pdf'})).id; }catch(e){} } }
      else if(file.size>4e6||!/png|jpe?g|webp/i.test(file.type)) img=await shrink(file,4000,0.9);
      let aspect=null; try{ const bm=await createImageBitmap(img); aspect=+(bm.width/bm.height).toFixed(4); }catch(e){}
      const d={name,set,aspect,at:TODAY}; if(pdfId) d.pdfId=pdfId;
      if(MODE==='local'){ d.id='l'+uid(); d.src=URL.createObjectURL(img); } else d.id=(await ASSETS.upload(img,{type:img.type||'image/png'})).id;
      (SITE.drawings||(SITE.drawings=[])).push(d); ok++;
    }catch(e){ toast(e&&e.message==='pdf'?'PDF 轉換失敗：'+file.name:assetErr(e)); }
  }
  if(ok) await saveSite(); say(''); renderSettings(); if(ok) toast('已上傳 '+ok+' 張到「'+set+'」');
}
async function uploadPlan(file){
  const msg=$('#sPlanMsg'); const say=t=>{ if(msg) msg.innerHTML=t; };
  try{
    let img=file, pdfId=null, name=file.name.replace(/\.[^.]+$/,'');
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
      say('<span class="spin"></span> 正在把 PDF 轉成圖片…');
      img=await pdfToImage(file);
      if(MODE!=='local'){ try{ const r=await ASSETS.upload(file,{type:'application/pdf'}); pdfId=r.id; }catch(e){} }
    } else if(file.size>4e6 || !/png|jpe?g|webp/i.test(file.type)){
      say('<span class="spin"></span> 正在壓縮圖片…'); img=await shrink(file,4000,0.9);
    }
    let aspect=null; try{ const bm=await createImageBitmap(img); aspect=+(bm.width/bm.height).toFixed(4); }catch(e){}
    say('<span class="spin"></span> 上傳中…');
    if(MODE==='local'){ SITE.drawing={src:URL.createObjectURL(img),name,aspect}; SITE.beams=[]; }
    else { const r=await ASSETS.upload(img,{type:img.type||'image/jpeg'}); SITE.drawing={id:r.id,pdfId,name,aspect}; SITE.beams=[]; }
    await saveSite(); say(''); renderAll(true); toast('平面圖已更新，接著在圖上劃出圍籬、分區和地樑'); setTimeout(()=>{ if(SITE&&SITE.drawing&&page==='settings') openPlanEditor(); },400);
  }catch(e){
    say(''); toast(e&&e.message==='pdf'?'PDF 轉換失敗，請改傳 JPG 或 PNG':assetErr(e));
  }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function pdfToImage(file){
  try{
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    if(!window.pdfjsLib) await loadScript(base+'pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    const buf=await file.arrayBuffer();
    const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    const pg=await pdf.getPage(1); const v0=pg.getViewport({scale:1});
    const sc=Math.min(4,3000/Math.max(v0.width,v0.height)); const vp=pg.getViewport({scale:sc});
    const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('pdf')),'image/jpeg',0.9));
  }catch(e){ throw new Error('pdf'); }
}

function wireExport(){

        catch(e){ msg.textContent= e&&e.code==='declined'?'已取消下載':'下載失敗，請再試一次'; } }

}

  <tr><td colspan="8" class="sec">五、工地職業安全衛生事項之督導、公共環境與安全之維護及其他工地行政事務：<div class="sub">（一）施工前檢查事項：<br>　1. 實施勤前教育（含工地預防災變及危害告知）：□有　□無<br>　2. 確認新進勞工是否提報勞工保險（或其他商業保險）資料及安全衛生教育訓練紀錄：□有　□無　□無新進勞工<br>　3. 檢查勞工個人防護具：□有　□無<br>（二）其他事項：</div></td></tr>

}
async function buildPdf(kind,ds,from,to){
  await loadPdfLibs();
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  if(!document.getElementById('xpCss')){ const st=document.createElement('style'); st.id='xpCss'; st.textContent=XP_CSS; document.head.appendChild(st); }
  const host=document.createElement('div'); host.className='xp'; document.body.appendChild(host);
  const pages=[];
  const newPage=()=>{ const pg=document.createElement('div'); pg.className='pg'; const inner=document.createElement('div'); inner.className='in'; pg.appendChild(inner); host.appendChild(pg); pages.push(pg); return inner; };
  const maxH=XP_H-XP_PAD-44;
  try{
    if(kind==='gen'){
      let cur=newPage();
      blocksGeneral(ds,from,to).forEach(h=>{ const b=document.createElement('div'); b.innerHTML=h; b.style.marginBottom='6px'; cur.appendChild(b);
        if(cur.scrollHeight>maxH && cur.children.length>1){ cur.removeChild(b); cur=newPage(); cur.appendChild(b); } });
    } else {
      ds.forEach((d,i)=>{ const cur=newPage(); cur.innerHTML=pagePublic(d,i+1,ds.length); const h=cur.scrollHeight; if(h>maxH){ const k=maxH/h; cur.style.transform=`scale(${k})`; cur.style.width=(100/k)+'%'; } });
    }
    pages.forEach((pg,i)=>{ const ft=document.createElement('div'); ft.className='ft'; ft.innerHTML=`<span>${esc(SITE.name||'')}${kind==='pub'?'　依工程會「公共工程施工品質管理作業要點」附表三-1 格式；累計數量以已登錄之日報計':''}</span><span>第 ${i+1} 頁／共 ${pages.length} 頁</span>`; pg.appendChild(ft); });
    const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    }
    return pdf.output('blob');
  } finally { host.remove(); }
}

/* ============ lightbox ============ */
let DOCSET=null;
function cutSet(i){ SIM.cut=i; if(i!=null){ SIM.cutLast=i; SIM.bPrev=null; const b=$('#islBPrev'); if(b) b.remove();
    if(!SITE.layout) toast('還沒有平面配置，只看得到樓板：到「設定 → 樓層」匯入'); }
  cutShow(); }
function cutShow(){ const el=$('#islCut'); if(!el) return; el.hidden=SIM.cut==null; const sb=$('#simCut'); if(sb) sb.setAttribute('aria-pressed',SIM.cut!=null);
  if(SIM.cut==null) return; const fl=SITE.floors||[], i=Math.min(SIM.cut,fl.length-1); $('#islCutName').textContent=(fl[i]&&fl[i].name)||'';
  el.querySelector('[data-cut="-1"]').disabled=i<=0; el.querySelector('[data-cut="1"]').disabled=i>=fl.length-1; }
function openDocs(set){
  const sh=$('#docSheet'), ds=SITE&&SITE.drawings||[]; if(!sh) return;
  const has=k=>ds.some(d=>(DSETS.includes(d.set)?d.set:'其他')===k), sets=DSETS.filter(has);
  if(!sets.length) return;
  DOCSET=set||((DOCSET&&has(DOCSET))?DOCSET:(has('完成圖')?'完成圖':sets[0]));
  $('#dsSets').innerHTML=sets.map(k=>`<button type="button" role="tab" data-dss="${k}" aria-selected="${k===DOCSET}" aria-pressed="${k===DOCSET}">${k}</button>`).join('');
  const L=ds.filter(d=>(DSETS.includes(d.set)?d.set:'其他')===DOCSET);
  $('#dsList').innerHTML=L.map(d=>`<li><button type="button" class="dthumb" data-dsv="${esc(d.id)}" aria-label="打開 ${esc(d.name)}"><img src="${esc(imgSrc(d))}" alt=""><span>${esc(d.name)}</span></button></li>`).join('');
  $$('#dsSets [data-dss]').forEach(b=>b.onclick=()=>openDocs(b.dataset.dss));
  $$('#dsList [data-dsv]').forEach(b=>b.onclick=()=>{ const d=ds.find(d=>d.id===b.dataset.dsv); if(d) openLightbox(imgSrc(d),d.name,true); });
  sh.querySelectorAll('[data-dsclose]').forEach(b=>b.onclick=()=>{ sh.hidden=true; });
  if(sh.hidden){ sh.hidden=false; setTimeout(()=>{ const f=sh.querySelector('[aria-pressed=true]'); if(f) f.focus(); },50); }
}
function openLightbox(src,title,zoomable){
  const lb=$('#lightbox'); $('#lbImg').src=src; $('#lbTitle').textContent=title; lb.classList.remove('zoomed');
  $('#lbZoom').hidden=!zoomable; $('#lbZoom').textContent='放大'; lb.hidden=false; $('#lbClose').focus();
}
$('#lbClose').onclick=()=>{ $('#lightbox').hidden=true; };
$('#lbZoom').onclick=()=>{ const lb=$('#lightbox'); lb.classList.toggle('zoomed'); $('#lbZoom').textContent=lb.classList.contains('zoomed')?'縮小':'放大'; };
addEventListener('keydown',e=>{ if(e.key!=='Escape') return; const lb=$('#lightbox'); if(!lb.hidden){ lb.hidden=true; return; } const ds=$('#docSheet'); if(ds&&!ds.hidden) ds.hidden=true; });

['today','island','report','history','settings'].forEach(x=>$('#p-'+x).hidden=x!==page);
document.body.classList.toggle('island-mode',page==='island');

init();
})();
